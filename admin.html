<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七文GEO - 内容管理后台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #0f172a; color: #e2e8f0; min-height:100vh; }
.header { background: #1e293b; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #334155; }
.header h1 { font-size:20px; color:#5eead4; }
.header nav { display:flex; gap:8px; }
.header nav button { padding:8px 18px; border-radius:8px; border:1px solid #475569; background:transparent; color:#94a3b8; cursor:pointer; font-size:13px; transition:all 0.2s; }
.header nav button.active { background:#0d9488; border-color:#0d9488; color:#fff; }
.container { max-width:1200px; margin:0 auto; padding:32px 24px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:32px; }
.stat-card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:20px; }
.stat-card .num { font-size:32px; font-weight:800; color:#5eead4; }
.stat-card .label { font-size:13px; color:#64748b; margin-top:4px; }
.section-title { font-size:18px; font-weight:700; color:#f1f5f9; margin-bottom:20px; display:flex; align-items:center; gap:12px; }
.btn { padding:10px 20px; border-radius:8px; border:none; cursor:pointer; font-size:14px; font-weight:600; transition:all 0.2s; }
.btn-primary { background:#0d9488; color:#fff; }
.btn-primary:hover { background:#0f766e; }
.btn-danger { background:#dc2626; color:#fff; }
.btn-ghost { background:transparent; border:1px solid #475569; color:#94a3b8; }
.btn-ghost:hover { border-color:#5eead4; color:#5eead4; }
.btn-sm { padding:6px 14px; font-size:12px; }
.top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px; }

/* 表单表格 */
.form-table { width:100%; border-collapse:collapse; background:#1e293b; border-radius:12px; overflow:hidden; }
.form-table th { background:#0f172a; padding:12px 16px; text-align:left; font-size:13px; color:#64748b; font-weight:600; }
.form-table td { padding:12px 16px; border-top:1px solid #334155; font-size:14px; color:#cbd5e1; }
.form-table tr:hover td { background:rgba(13,148,136,0.05); }
.status-badge { padding:3px 10px; border-radius:100px; font-size:12px; font-weight:600; }
.status-badge.未处理 { background:rgba(234,179,8,0.15); color:#eab308; }
.status-badge.已联系 { background:rgba(13,148,136,0.15); color:#5eead4; }
.status-badge.已成交 { background:rgba(59,130,246,0.15); color:#3b82f6; }

/* 新闻卡片 */
.news-admin-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:20px; }
.news-admin-card { background:#1e293b; border:1px solid #334155; border-radius:12px; overflow:hidden; transition:border-color 0.2s; }
.news-admin-card:hover { border-color:#0d9488; }
.news-admin-card .card-body { padding:16px; }
.news-admin-card .card-category { display:inline-block; padding:2px 10px; border-radius:100px; font-size:11px; font-weight:600; margin-bottom:8px; }
.news-admin-card .card-category.geo { background:rgba(13,148,136,0.2); color:#5eead4; }
.news-admin-card .card-category.ai { background:rgba(37,99,235,0.2); color:#60a5fa; }
.news-admin-card .card-category.training { background:rgba(147,51,234,0.2); color:#c084fc; }
.news-admin-card .card-category.case { background:rgba(212,168,83,0.2); color:#d4a853; }
.news-admin-card .card-category.media { background:rgba(239,68,68,0.2); color:#f87171; }
.news-admin-card h3 { font-size:15px; font-weight:700; color:#f1f5f9; margin-bottom:6px; line-height:1.4; }
.news-admin-card .card-date { font-size:12px; color:#64748b; margin-bottom:12px; }
.news-admin-card .card-actions { display:flex; gap:8px; }

/* 弹窗 */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:1000; align-items:center; justify-content:center; padding:24px; }
.modal-overlay.show { display:flex; }
.modal { background:#1e293b; border:1px solid #334155; border-radius:16px; max-width:720px; width:100%; max-height:85vh; overflow-y:auto; }
.modal-header { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid #334155; }
.modal-header h2 { font-size:18px; font-weight:700; }
.modal-close { width:32px; height:32px; border-radius:8px; border:1px solid #475569; background:transparent; color:#94a3b8; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
.modal-body { padding:24px; }
.form-group { margin-bottom:18px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:#94a3b8; margin-bottom:6px; }
.form-group input, .form-group select, .form-group textarea {
  width:100%; padding:10px 14px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#f1f5f9; font-size:14px; outline:none; font-family:inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#0d9488; }
.form-group textarea { min-height:80px; resize:vertical; }
.form-actions { display:flex; gap:12px; justify-content:flex-end; margin-top:24px; }

/* 空状态 */
.empty-state { text-align:center; padding:60px 20px; color:#475569; }
.empty-state .icon { font-size:48px; margin-bottom:16px; }
.empty-state p { font-size:15px; }

/* 导入导出 */
.file-input { display:none; }
.toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:10px; background:#0d9488; color:#fff; font-size:14px; font-weight:600; z-index:2000; opacity:0; transition:opacity 0.3s; }
.toast.show { opacity:1; }

@media (max-width:768px) {
  .stats { grid-template-columns:repeat(2,1fr); }
  .news-admin-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div class="header">
  <h1>🚀 七文GEO 内容管理后台</h1>
  <nav>
    <button class="active" onclick="switchTab('forms')">📋 表单数据</button>
    <button onclick="switchTab('news')">📰 新闻管理</button>
    <button onclick="switchTab('settings')">⚙️ 设置</button>
  </nav>
</div>

<!-- 表单数据页 -->
<div class="container" id="tab-forms">
  <div class="top-bar">
    <div class="section-title">📋 表单提交数据</div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost btn-sm" onclick="exportForms()">📤 导出</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFormsInput').click()">📥 导入</button>
      <button class="btn btn-danger btn-sm" onclick="clearForms()">🗑️ 清空</button>
      <input type="file" id="importFormsInput" class="file-input" accept=".json" onchange="importForms(event)">
    </div>
  </div>
  <div class="stats" id="formStats"></div>
  <div id="formsTableWrap"></div>
</div>

<!-- 新闻管理页 -->
<div class="container" id="tab-news" style="display:none;">
  <div class="top-bar">
    <div class="section-title">📰 新闻内容管理</div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-primary btn-sm" onclick="openNewsModal()">＋ 新增新闻</button>
      <button class="btn btn-ghost btn-sm" onclick="exportNews()">📤 导出</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importNewsInput').click()">📥 导入</button>
      <input type="file" id="importNewsInput" class="file-input" accept=".json" onchange="importNews(event)">
    </div>
  </div>
  <div class="stats" id="newsStats"></div>
  <div class="news-admin-grid" id="newsGrid"></div>
  <div class="empty-state" id="newsEmpty" style="display:none;">
    <div class="icon">📰</div>
    <p>暂无新闻，点击「＋ 新增新闻」创建第一篇</p>
  </div>
</div>

<!-- 设置页 -->
<div class="container" id="tab-settings" style="display:none;">
  <div class="section-title">⚙️ 数据管理</div>
  <div style="background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px;">
    <h3 style="color:#f1f5f9;margin-bottom:16px;">数据导入/导出</h3>
    <p style="color:#64748b;font-size:14px;margin-bottom:20px;">所有数据保存在浏览器本地存储中，可通过导出备份，也可导入之前备份的数据文件。</p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="exportAll()">📦 导出全部数据</button>
      <button class="btn btn-ghost" onclick="document.getElementById('importAllInput').click()">📂 导入全部数据</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空所有数据</button>
      <input type="file" id="importAllInput" class="file-input" accept=".json" onchange="importAll(event)">
    </div>
    <div style="margin-top:32px;">
      <h3 style="color:#f1f5f9;margin-bottom:12px;">同步到官网</h3>
      <p style="color:#64748b;font-size:14px;margin-bottom:12px;">导出新闻数据后，将 `news-data.json` 放到官网同目录下，官网即可读取最新新闻。</p>
      <button class="btn btn-ghost" onclick="exportNewsFile()">📤 导出 news-data.json</button>
    </div>
  </div>
</div>

<!-- 新闻编辑弹窗 -->
<div class="modal-overlay" id="newsModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="newsModalTitle">新增新闻</h2>
      <button class="modal-close" onclick="closeNewsModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editNewsId">
      <div class="form-group">
        <label>新闻标题 *</label>
        <input type="text" id="newsTitle" placeholder="请输入新闻标题">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="form-group">
          <label>分类</label>
          <select id="newsCategory">
            <option value="geo">GEO干货</option>
            <option value="ai">行业趋势</option>
            <option value="training">训练营</option>
            <option value="case">客户案例</option>
            <option value="media">运营干货</option>
          </select>
        </div>
        <div class="form-group">
          <label>发布日期</label>
          <input type="date" id="newsDate">
        </div>
      </div>
      <div class="form-group">
        <label>摘要（列表页显示）</label>
        <textarea id="newsExcerpt" placeholder="请输入新闻摘要（100字以内）"></textarea>
      </div>
      <div class="form-group">
        <label>正文内容（支持HTML）</label>
        <textarea id="newsContent" style="min-height:200px;" placeholder="请输入正文内容，可用 <p> <h3> <ul> <li> 等HTML标签"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeNewsModal()">取消</button>
        <button class="btn btn-primary" onclick="saveNews()">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 数据层 ==========
const STORAGE_KEYS = { forms: 'qw_forms', news: 'qw_news' };

function loadData(key) {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEYS[key])) || []; }
  catch(e) { return []; }
}
function saveData(key, data) {
  localStorage.setItem(STORAGE_KEYS[key], JSON.stringify(data));
}

// ========== 标签页切换 ==========
function switchTab(tab) {
  ['forms','news','settings'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
    document.querySelectorAll('.header nav button')[t==='forms'?0:t==='news'?1:2].classList.toggle('active', t === tab);
  });
  if (tab === 'forms') renderForms();
  if (tab === 'news') renderNews();
}

// ========== 表单数据 ==========
function renderForms() {
  let data = loadData('forms');
  // 统计
  const stats = [
    { num: data.length, label: '总提交数' },
    { num: data.filter(f=>f.status==='未处理').length, label: '未处理' },
    { num: data.filter(f=>f.status==='已联系').length, label: '已联系' },
    { num: data.filter(f=>f.status==='已成交').length, label: '已成交' },
  ];
  document.getElementById('formStats').innerHTML = stats.map(s => `
    <div class="stat-card"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>
  `).join('');

  if (data.length === 0) {
    document.getElementById('formsTableWrap').innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无表单提交数据</p></div>';
    return;
  }
  const statusOptions = ['未处理','已联系','已成交'];
  document.getElementById('formsTableWrap').innerHTML = `
    <table class="form-table">
      <thead><tr>
        <th>时间</th><th>姓名</th><th>手机</th><th>企业</th><th>需求</th><th>状态</th><th>操作</th>
      </tr></thead>
      <tbody>
        ${data.map((f,i) => `
          <tr>
            <td>${new Date(f.submittedAt || f.time).toLocaleString('zh-CN')}</td>
            <td>${f.name||''}</td>
            <td>${f.phone||''}</td>
            <td>${f.company||'-'}</td>
            <td>${f.need||'-'}</td>
            <td><select class="status-badge ${f.status||'未处理'}" onchange="updateFormStatus(${f.id||i}, this.value)" style="background:transparent;border:none;cursor:pointer;">
              ${statusOptions.map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s}</option>`).join('')}
            </select></td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteForm(${f.id||i})">删除</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function updateFormStatus(id, status) {
  let data = loadData('forms');
  const idx = data.findIndex(f => (f.id||0) === id);
  if (idx !== -1) { data[idx].status = status; saveData('forms', data); }
  renderForms();
}

function deleteForm(id) {
  if (!confirm('确定删除这条记录？')) return;
  let data = loadData('forms');
  data = data.filter(f => (f.id||0) !== id);
  saveData('forms', data);
  renderForms();
  showToast('已删除');
}

function clearForms() {
  if (!confirm('确定清空所有表单数据？此操作不可恢复！')) return;
  saveData('forms', []);
  renderForms();
  showToast('已清空');
}

function exportForms() {
  const data = loadData('forms');
  downloadJSON(data, '七文GEO-表单数据.json');
  showToast('已导出表单数据');
}

function importForms(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) { saveData('forms', data); renderForms(); showToast('导入成功！'); }
    } catch(err) { alert('文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ========== 新闻管理 ==========
function renderNews() {
  let data = loadData('news');
  const catNames = { geo:'GEO干货', ai:'行业趋势', training:'训练营', case:'客户案例', media:'运营干货' };
  const stats = [
    { num: data.length, label: '新闻总数' },
    { num: data.filter(n=>n.category==='geo').length, label: 'GEO干货' },
    { num: data.filter(n=>n.category==='case').length, label: '客户案例' },
    { num: data.filter(n=>n.category==='training').length, label: '训练营' },
  ];
  document.getElementById('newsStats').innerHTML = stats.map(s => `
    <div class="stat-card"><div class="num">${s.num}</div><div class="label">${s.label}</div></div>
  `).join('');

  const grid = document.getElementById('newsGrid');
  const empty = document.getElementById('newsEmpty');
  if (data.length === 0) { grid.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  grid.innerHTML = data.map((n,i) => `
    <div class="news-admin-card">
      <div class="card-body">
        <span class="card-category ${n.category||'geo'}">${catNames[n.category]||n.category||'GEO干货'}</span>
        <h3>${n.title||'无标题'}</h3>
        <div class="card-date">${n.date||''}</div>
        <div style="font-size:13px;color:#64748b;margin:8px 0 12px;">${(n.excerpt||'').substring(0,60)}...</div>
        <div class="card-actions">
          <button class="btn btn-ghost btn-sm" onclick="editNews(${n.id||i})">编辑</button>
          <button class="btn btn-danger btn-sm" onclick="deleteNews(${n.id||i})">删除</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openNewsModal(id) {
  document.getElementById('newsModalTitle').textContent = id ? '编辑新闻' : '新增新闻';
  document.getElementById('editNewsId').value = id || '';
  if (!id) {
    document.getElementById('newsTitle').value = '';
    document.getElementById('newsCategory').value = 'geo';
    document.getElementById('newsDate').value = new Date().toISOString().slice(0,10);
    document.getElementById('newsExcerpt').value = '';
    document.getElementById('newsContent').value = '';
  }
  document.getElementById('newsModal').classList.add('show');
}

function closeNewsModal() { document.getElementById('newsModal').classList.remove('show'); }

function editNews(id) {
  const data = loadData('news');
  const item = data.find(n => String(n.id) === String(id));
  if (!item) return;
  document.getElementById('editNewsId').value = id;
  document.getElementById('newsModalTitle').textContent = '编辑新闻';
  document.getElementById('newsTitle').value = item.title || '';
  document.getElementById('newsCategory').value = item.category || 'geo';
  document.getElementById('newsDate').value = item.date || '';
  document.getElementById('newsExcerpt').value = item.excerpt || '';
  document.getElementById('newsContent').value = item.content || '';
  document.getElementById('newsModal').classList.add('show');
}

function saveNews() {
  const id = document.getElementById('editNewsId').value;
  const title = document.getElementById('newsTitle').value.trim();
  if (!title) { alert('请输入新闻标题'); return; }
  let data = loadData('news');
  const now = new Date().toISOString();
  const item = {
    id: id || String(Date.now()),
    title: title,
    category: document.getElementById('newsCategory').value,
    date: document.getElementById('newsDate').value,
    excerpt: document.getElementById('newsExcerpt').value.trim(),
    content: document.getElementById('newsContent').value.trim(),
    updatedAt: now,
  };
  if (!id) { item.createdAt = now; data.unshift(item); }
  else { const idx = data.findIndex(n => String(n.id)===String(id)); if(idx!==-1) data[idx]=item; }
  saveData('news', data);
  closeNewsModal();
  renderNews();
  showToast(id ? '已更新' : '已创建');
  // 自动导出到文件
  exportNewsFile();
}

function deleteNews(id) {
  if (!confirm('确定删除这条新闻？')) return;
  let data = loadData('news');
  data = data.filter(n => String(n.id) !== String(id));
  saveData('news', data);
  renderNews();
  showToast('已删除');
}

function exportNews() {
  const data = loadData('news');
  downloadJSON(data, '七文GEO-新闻数据.json');
  showToast('已导出新闻数据');
}

function exportNewsFile() {
  // 导出为 news-data.json，可放到官网目录供读取
  const data = loadData('news');
  const content = JSON.stringify(data, null, 2);
  const blob = new Blob([content], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'news-data.json';
  a.click();
}

function importNews(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) { saveData('news', data); renderNews(); showToast('导入成功！'); }
    } catch(err) { alert('文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearNews() {
  if (!confirm('确定清空所有新闻？')) return;
  saveData('news', []);
  renderNews();
}

// ========== 工具函数 ==========
function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function exportAll() {
  const all = { forms: loadData('forms'), news: loadData('news'), exportTime: new Date().toISOString() };
  downloadJSON(all, '七文GEO-全部数据备份.json');
  showToast('已导出全部数据');
}

function importAll(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data.forms) saveData('forms', data.forms);
      if (data.news) saveData('news', data.news);
      renderForms(); renderNews();
      showToast('导入成功！');
    } catch(err) { alert('文件格式错误'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAll() {
  if (!confirm('确定清空所有数据？此操作不可恢复！')) return;
  saveData('forms', []); saveData('news', []);
  renderForms(); renderNews();
  showToast('已清空所有数据');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2000);
}
